name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The README claims Linux, macOS and Windows support and a Go 1.22 floor.
  # Both are only true if they are actually exercised.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go tool cover -func=coverage.out | tail -1

  # Windows is the platform whose install path cannot be unit-tested from a
  # Unix runner, and the one where a build-tag mistake hides until someone
  # tries to use it.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build every supported platform
        run: |
          for pair in linux/amd64 linux/arm64 linux/386 \
                      darwin/amd64 darwin/arm64 \
                      windows/amd64 windows/arm64 windows/386 \
                      freebsd/amd64; do
            echo "==> $pair"
            GOOS="${pair%%/*}" GOARCH="${pair##*/}" go build ./...
            GOOS="${pair%%/*}" GOARCH="${pair##*/}" go vet ./...
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run

      - name: gofumpt
        run: |
          go install mvdan.cc/gofumpt@v0.9.1
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofumpt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      # This package exists so its consumers can gate CI on govulncheck. It has
      # to hold itself to that first.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      # The core package's selling point is having no dependencies. A stray
      # import in a future change would silently remove it.
      - name: Core package has no third-party dependencies
        run: |
          module="$(go list -m)"
          external="$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' . \
            | grep -v "^${module}\$" | grep -v "^${module}/" || true)"
          if [ -n "$external" ]; then
            echo "the core package gained third-party dependencies:"
            echo "$external"
            exit 1
          fi

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fuzz the version parser
        run: go test -run FuzzParseVersion -fuzz FuzzParseVersion -fuzztime 60s .
