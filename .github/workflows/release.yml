name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A library ships as a git tag, so the only thing that must hold is that the
  # tagged commit is green. Publishing a broken tag is unfixable: the module
  # proxy caches it permanently and it cannot be retracted, only superseded.
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race ./...

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

      # pkg.go.dev only indexes a version once the proxy has fetched it.
      - name: Prime the module proxy
        env:
          TAG: ${{ github.ref_name }}
        run: |
          module="$(go list -m)"
          curl -fsS "https://proxy.golang.org/${module}/@v/${TAG}.info" || \
            echo "proxy has not picked up ${TAG} yet; it will on first fetch"
