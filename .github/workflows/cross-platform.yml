name: "Cross-platform: macOS, Windows, oldest Go, cross-compile, fuzz"

# No push trigger: release.yml calls this on every push to main.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Windows runners default to PowerShell, which splits an argument like
# -coverprofile=coverage.out at the '='.
defaults:
  run:
    shell: bash

jobs:
  # The README claims Linux, macOS and Windows support and a Go floor. Both are
  # only true if they are actually exercised.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [floor, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The floor is whatever go.mod declares. A literal version here falls
          # behind when go.mod is raised, and setup-go then installs a Go that
          # refuses to build the module.
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: go.mod

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race -coverprofile=coverage.out ./...

      - name: Report coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go tool cover -func=coverage.out | tail -1

  # Windows is the platform whose install path cannot be unit-tested from a
  # Unix runner, and the one where a build-tag mistake hides until someone
  # tries to use it.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build every supported platform
        run: |
          for pair in linux/amd64 linux/arm64 linux/386 \
                      darwin/amd64 darwin/arm64 \
                      windows/amd64 windows/arm64 windows/386 \
                      freebsd/amd64; do
            echo "==> $pair"
            GOOS="${pair%%/*}" GOARCH="${pair##*/}" go build ./...
            GOOS="${pair%%/*}" GOARCH="${pair##*/}" go vet ./...
          done

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fuzz the version parser
        run: go test -run FuzzParseVersion -fuzz FuzzParseVersion -fuzztime 60s .
